[mod-name]
train-foundry=Train Foundry
train-foundry-stc=Train Foundry for Smart Train Combinator

[mod-description]
train-foundry=Une grande fonderie à trains qui assemble des trains complets à partir de modèles de blueprints : importez un blueprint de train, mettez-le en file d'attente, alimentez les pièces avec des bras, et regardez le train fini faire le plein et partir tout seul sur votre réseau ferroviaire.
train-foundry-stc=Une grande fonderie à trains qui assemble des trains complets à partir des modèles de Smart Train Combinator : choisissez une forme de train, sa ressource, et le train fini fait le plein et part tout seul sur votre réseau. Nécessite Smart Train Combinator.

