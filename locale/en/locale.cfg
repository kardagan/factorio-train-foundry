[mod-name]
train-foundry=Train Foundry
train-foundry-stc=Train Foundry for Smart Train Combinator

[mod-description]
train-foundry=A large train foundry building that assembles complete trains from blueprint templates: import a train blueprint, queue it, feed the parts with inserters, and watch the finished train fuel up and drive off onto your rail network on its own.
train-foundry-stc=A large train foundry that assembles complete trains from Smart Train Combinator models: pick a train shape, choose its resource, and the finished train fuels up and drives off onto your rail network on its own. Requires Smart Train Combinator.

