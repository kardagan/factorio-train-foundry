[entity-description]
train-foundry=Assembles complete trains from blueprint templates. Connect your rail network to the exit track on the left (west); a right-side (east) exit can be enabled in the foundry window. Feed the parts with inserters anywhere along the edge — they all land in one shared internal stock.
tfstc-foundry=Assembles complete trains from Smart Train Combinator models. Pick a train shape, choose its resource; the foundry fuels the train and sends it off. Feed the parts with inserters anywhere along the edge.

