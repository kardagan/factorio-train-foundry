[technology-description]
train-foundry=A building that assembles complete trains from blueprint templates, requesting parts from the logistic network and dispatching finished trains onto the rail network.
tfstc-foundry=A building that assembles complete trains from Smart Train Combinator models and dispatches finished trains onto the rail network.
nullius-train-foundry=A building that assembles complete trains from blueprint templates, requesting parts from the logistic network and dispatching finished trains onto the rail network.
nullius-tfstc-foundry=A building that assembles complete trains from Smart Train Combinator models and dispatches finished trains onto the rail network.

